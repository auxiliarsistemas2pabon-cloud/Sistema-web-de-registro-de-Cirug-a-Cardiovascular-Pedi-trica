name: ${STACK_NAME:-cirugia-cardiovascular-clinica}

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3001"
  LOCAL_HTTPS: "false"
  RUN_MIGRATIONS: "false"
  TRUST_PROXY: "1"
  APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_ISOLATED_NETWORK: "true"
  DB_NAME: ${DB_NAME:-cardio_pediatrica}
  DB_USER: cardio_app
  DB_PASSWORD_FILE: /run/secrets/app_db_password
  MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_key
  SESSION_MINUTES: "15"
  SESSION_MAX_HOURS: "12"

x-app-security: &app-security
  image: ${APP_IMAGE:-cirugia-cardiovascular:preparada}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
  pids_limit: 128
  mem_limit: 512m
  cpus: 2
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}

services:
  mysql:
    image: cirugia-mysql:segura
    user: "999:999"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cardio_pediatrica}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: "%"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00", "--local-infile=0", "--secure-file-priv=NULL"]
    secrets: [mysql_root_password]
    volumes: [mysql_data:/var/lib/mysql]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/var/run/mysqld:rw,nosuid,size=16m,uid=999,gid=999,mode=0750"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [datos]
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  migrate:
    <<: *app-security
    profiles: [tools]
    command: [node, deploy/provision.mjs]
    environment:
      <<: *app-environment
      MIGRATION_DB_USER: root
      MIGRATION_DB_PASSWORD_FILE: /run/secrets/mysql_root_password
      BACKUP_DB_USER: cardio_backup
      BACKUP_DB_PASSWORD_FILE: /run/secrets/backup_db_password
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Defina INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_password
      INITIAL_ADMIN_NAME: Administrador inicial
    secrets: [mysql_root_password, app_db_password, backup_db_password, mfa_key, bootstrap_password]
    networks: [datos]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck: {disable: true}

  app:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s
    environment: *app-environment
    secrets: [app_db_password, mfa_key]
    networks: [proxy_app, datos]
    depends_on:
      mysql: {condition: service_healthy}

  backup:
    image: cirugia-mysql:segura
    profiles: [tools]
    user: "1000:1000"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export MYSQL_PWD="$$(cat /run/secrets/backup_db_password)"
        exec mysqldump --no-defaults --host=mysql --user=cardio_backup --single-transaction --no-tablespaces --set-gtid-purged=OFF --skip-add-locks "$$DB_NAME"
    environment:
      DB_NAME: ${DB_NAME:-cardio_pediatrica}
      HOME: /tmp
    secrets: [backup_db_password]
    networks: [datos]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    pids_limit: 64
    mem_limit: 256m
    depends_on:
      mysql: {condition: service_healthy}

  proxy:
    image: cirugia-caddy:segura
    user: "1000:1000"
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN}
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN}
      CLINIC_CIDRS: ${CLINIC_CIDRS:?Defina CLINIC_CIDRS}
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:8080"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    tmpfs: ["/config:rw,noexec,nosuid,size=16m", "/tmp:rw,noexec,nosuid,size=16m"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    networks: [entrada, proxy_app]
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

networks:
  entrada: {}
  proxy_app: {internal: true}
  datos: {internal: true}

volumes:
  mysql_data:
    external: true
    name: ${STACK_NAME:-cirugia-cardiovascular-clinica}_mysql_data
  caddy_data:
    external: true
    name: ${STACK_NAME:-cirugia-cardiovascular-clinica}_caddy_data

secrets:
  mysql_root_password: {file: "./private/${DEPLOY_INSTANCE:-clinica}/secrets/mysql_root_password"}
  app_db_password: {file: "./private/${DEPLOY_INSTANCE:-clinica}/secrets/app_db_password"}
  backup_db_password: {file: "./private/${DEPLOY_INSTANCE:-clinica}/secrets/backup_db_password"}
  mfa_key: {file: "./private/${DEPLOY_INSTANCE:-clinica}/secrets/mfa_key"}
  bootstrap_password: {file: "./private/${DEPLOY_INSTANCE:-clinica}/secrets/bootstrap_password"}
