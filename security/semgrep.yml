rules:
  - id: cardio.sql-request-in-query
    languages: [javascript, typescript]
    mode: taint
    message: No construya SQL con datos de una petición; utilice parámetros.
    severity: ERROR
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.body
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body.$FIELD
          - pattern: $REQ.query.$FIELD
          - pattern: $REQ.params.$FIELD
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: Number.parseInt(...)
      - pattern: parseInt(...)
      - pattern: $DB.escape(...)
      - pattern: $DB.escapeId(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
          - focus-metavariable: $SQL
    paths:
      exclude: ["**/pruebas/**"]
  - id: cardio.no-dynamic-code
    languages: [javascript, typescript]
    message: No ejecute texto como código.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: cardio.tls-verification
    languages: [javascript, typescript]
    message: No desactive la validación del certificado TLS.
    severity: ERROR
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
    paths:
      exclude: ["**/pruebas/**"]
  - id: cardio.shell-in-web-server
    languages: [javascript, typescript]
    message: El servidor web no debe ejecutar una shell.
    severity: ERROR
    pattern-either:
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: "spawn(..., {..., shell: true, ...})"
    paths:
      exclude: ["**/pruebas/**"]
