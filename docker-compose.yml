# Grupo local unificado. Los dos motores conservan sus volúmenes y puertos.
name: cirugia-cardiovascular

services:
  db:
    image: postgres:16
    container_name: backend-db-1
    restart: unless-stopped
    env_file:
      - .env.postgres.docker
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: cardio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-cardio_pediatrica}
      MYSQL_USER: ${DB_USER:-cardio}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - cardio_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
    external: true
    name: backend_postgres_data
  cardio_mysql_data:
    external: true
    name: sistemawebdecirugacardiovascularpeditrica_cardio_mysql_data
